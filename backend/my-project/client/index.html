<!-- Форма входа -->
<form id="loginForm">
    <input type="text" id="email" placeholder="Ваша почта" required>
    <input type="password" id="password" placeholder="Пароль" required>
    <button type="submit">Войти</button>
</form>

<!-- Форма регистрации -->
<form id="registerForm">
    <input type="text" id="yourEmail" placeholder="Ваша почта" required>
    <input type="password" id="newPassword" placeholder="Новый пароль" required>
    <button type="submit">Зарегистрироваться</button>
</form>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Comfortaa&display=swap">
    <title>To-Do List</title>
    <style>
        body {
            font-family: 'Comfortaa', sans-serif;
            background-color: #252526; /* Цвет темного фона */
            color: #e0e0e0;
        }

        #taskList {
            max-width: 650px;
            margin-bottom: 20px;
            overflow-wrap: break-word;
        }
        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .task-delete {
            cursor: pointer;
        }
        .task-edit {
            cursor: pointer;
        }

        #fodlerList {
            max-width: 650px;
            margin-top: 10px;
            overflow-wrap: break-word;
        }
        .folder {
            font-family: 'Comfortaa', sans-serif;
            border: none; 
            background-color: #484848;
            color: #d7d7d7;
            display: flex;
            padding: 10px; 
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-radius: 5px;
        }
        .folder-delete {
            cursor: pointer;
        }
        .folder-edit {
            cursor: pointer;
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        input[type="time"],
        #loginForm [type = submit],
        #registerForm [type = submit],
        #folder button[type="submit"] {
            font-family: 'Comfortaa', sans-serif;
            background-color: #484848;
            color: #d7d7d7;
            border: none; 
            padding: 10px; 
            margin: 5px 0; 
            border-radius: 5px;
        }

        #buttonsBlock button[type="submit"],
        #buttonsBlock button[type="button"] {
            align-items: left;
            position: fixed;
            left: 620px;
            top: 38px;
            min-width: 100px;
            min-height: 100px;
            background-color: #484848;
            color: #e0e0e0; 
            border: none; 
            padding: 10px; 
            margin: 5px 0;
            border-radius: 50px;
            cursor: pointer;
        }

        .buttons-container {
            display: flex;
            align-items: center;
        }
        .dropdown {
            position: relative;
            display: inline-block;
            background-color: #484848;
            border-radius: 5px;
            margin-right: 10px;
        }
        .dropdown button {
            font-family: 'Comfortaa', sans-serif;
            background-color: #484848;
            color: #e0e0e0;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .myFolder-button button {
            font-family: 'Comfortaa', sans-serif;
            background-color: #484848;
            color: #e0e0e0;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #676767;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-content a {
            color: #e0e0e0;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        .dropdown-content a:hover {
            background-color: #484848;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }

    </style>
</head>
<body>
<h1>To-Do List</h1>

<div id="buttonsBlock">
    <button type="submit" id="submitButton">➕</button>
    <button type="button" id="editButton">✎</button>
</div>

<form id="taskForm">
    <input type="text" id="taskInput" placeholder="Add a new task">
    <input type="text" id="descriptionInput" placeholder="Add description"> 
    <input type="date" id="dateInput" required>
    <input type="time" id="timeInput" required>
</form>

<form id="folderForm">
    <input type="text" id="folderInput" placeholder="Add a new folder">
</form>

<div class="buttons-container">
    <div class="dropdown">
        <button class="dropbtn" id="dropbtn">Sort by</button>
        <div class="dropdown-content">
            <a href="#">default</a>
            <a href="#">lexicographic</a>
            <a href="#">deadline</a>
        </div>
    </div>

    <div class="myFolder-button">
        <button type="submit" id="myFolders">My folders</button>
    </div>
</div>

<ul id="taskList">
    <!-- Сюда будут добавляться задачи -->
</ul>

<ul id="folderList">
    <!-- Сюда будут добавляться задачи -->
</ul>

<script src="script.js"></script> <!-- Подключаем JavaScript файл -->
</body>
</html>
